<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>해담펭귄</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; touch-action: none; }
#ui {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
}
#dist {
  position: absolute; top: max(env(safe-area-inset-top,0px), 16px);
  left: 50%; transform: translateX(-50%);
  color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.7);
  text-align: center; line-height: 1.2;
}
#dist .main { font-size: clamp(28px,8vw,44px); font-weight: 900; }
#dist .best { font-size: clamp(12px,3.5vw,18px); opacity: .8; }
#fish-ui {
  position: absolute; top: max(env(safe-area-inset-top,0px), 16px);
  right: 16px; display: flex; align-items: center; gap: 6px;
  background: rgba(0,0,0,.4); border-radius: 20px; padding: 6px 12px;
  color: #FFD700; font-size: clamp(16px,4.5vw,24px); font-weight: 700;
}
#hearts {
  position: absolute; top: max(env(safe-area-inset-top,0px), 16px);
  left: 16px; display: flex; gap: 4px; font-size: clamp(20px,5.5vw,30px);
}
#gear-btn {
  position: absolute; bottom: max(env(safe-area-inset-bottom,0px), 20px);
  left: 16px; font-size: 28px; cursor: pointer; pointer-events: all;
  background: rgba(0,0,0,.4); border-radius: 50%; width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
}
#popup {
  position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,.75); color: #fff; border-radius: 16px;
  padding: 16px 28px; text-align: center; font-size: clamp(18px,5vw,28px);
  font-weight: 800; pointer-events: none; transition: opacity .4s;
}
#shop-overlay {
  position: fixed; inset: 0; background: rgba(0,30,60,.92);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 16px; padding: 24px;
  pointer-events: all; z-index: 10;
}
#shop-overlay h2 { color: #90E0EF; font-size: 28px; margin-bottom: 8px; }
.shop-item {
  background: rgba(255,255,255,.08); border: 2px solid rgba(144,224,239,.3);
  border-radius: 16px; padding: 14px 20px; width: 100%; max-width: 360px;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer;
}
.shop-item:active { background: rgba(144,224,239,.2); }
.shop-item .name { color: #fff; font-size: 16px; font-weight: 700; }
.shop-item .desc { color: #90E0EF; font-size: 13px; margin-top: 2px; }
.shop-item .cost { color: #FFD700; font-size: 15px; font-weight: 800; }
#shop-close {
  margin-top: 8px; background: #00B4D8; color: #fff; border: none;
  border-radius: 30px; padding: 12px 40px; font-size: 18px; font-weight: 800;
  cursor: pointer; pointer-events: all;
}
#start-screen {
  position: fixed; inset: 0; background: linear-gradient(180deg,#0D3B5E 0%, #1A6B8A 50%, #0D3B5E 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; z-index: 20; pointer-events: all;
}
#start-screen h1 { color: #CAF0F8; font-size: clamp(36px,10vw,56px); font-weight: 900; text-shadow: 0 4px 20px rgba(0,180,216,.8); }
#start-screen .sub { color: #90E0EF; font-size: 16px; text-align: center; max-width: 280px; line-height: 1.5; }
#start-btn {
  background: linear-gradient(135deg,#00B4D8,#0077B6); color: #fff;
  border: none; border-radius: 30px; padding: 16px 48px;
  font-size: 22px; font-weight: 800; cursor: pointer; margin-top: 8px;
  box-shadow: 0 8px 24px rgba(0,119,182,.5);
}
#gameover-screen {
  position: fixed; inset: 0; background: rgba(0,15,30,.9);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; z-index: 20; pointer-events: all;
}
#gameover-screen h2 { color: #FF6B6B; font-size: 36px; font-weight: 900; }
#gameover-screen .score { color: #CAF0F8; font-size: 22px; }
#gameover-screen .best-score { color: #FFD700; font-size: 18px; }
#retry-btn {
  background: linear-gradient(135deg,#FF6B6B,#C0392B); color: #fff;
  border: none; border-radius: 30px; padding: 14px 44px;
  font-size: 20px; font-weight: 800; cursor: pointer; margin-top: 8px;
}
.skin-row { display: flex; gap: 12px; margin-top: 4px; }
.skin-btn {
  background: rgba(255,255,255,.1); border: 2px solid transparent; border-radius: 50%;
  width: 52px; height: 52px; cursor: pointer; font-size: 28px;
  display: flex; align-items: center; justify-content: center;
  pointer-events: all;
}
.skin-btn.selected { border-color: #00B4D8; background: rgba(0,180,216,.25); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hearts"></div>
  <div id="dist">
    <div class="main" id="dist-val">0m</div>
    <div class="best" id="best-val">Best 0m</div>
  </div>
  <div id="fish-ui">🐟 <span id="fish-val">0</span></div>
  <div id="gear-btn">⚙️</div>
  <div id="popup" style="opacity:0"></div>
</div>

<div id="start-screen">
  <h1>해담펭귄</h1>
  <div class="sub">기기를 기울여 좌우 이동<br>화면 탭으로 점프!</div>
  <div class="skin-row" id="skin-selector">
    <button class="skin-btn selected" data-skin="0">🐧</button>
    <button class="skin-btn" data-skin="1">🐯</button>
    <button class="skin-btn" data-skin="2">⛑️</button>
  </div>
  <button id="start-btn">시작!</button>
</div>

<div id="gameover-screen" style="display:none">
  <h2>게임 오버</h2>
  <div class="score" id="go-score">0m</div>
  <div class="best-score" id="go-best">최고 0m</div>
  <button id="retry-btn">다시 도전!</button>
  <button id="shop-btn-go" style="background:rgba(0,180,216,.3);color:#90E0EF;border:2px solid #00B4D8;border-radius:30px;padding:12px 36px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;">업그레이드 상점</button>
</div>

<div id="shop-overlay" style="display:none">
  <h2>🐟 업그레이드 상점</h2>
  <div class="shop-item" id="upg-rocket">
    <div><div class="name">🚀 로켓 지속 시간 +</div><div class="desc" id="upg-rocket-desc">현재: 600m</div></div>
    <div class="cost" id="upg-rocket-cost">40,000🐟</div>
  </div>
  <div class="shop-item" id="upg-hp">
    <div><div class="name">❤️ 생명력 보너스</div><div class="desc" id="upg-hp-desc">매 500m마다 하트 +1</div></div>
    <div class="cost" id="upg-hp-cost">10,000🐟</div>
  </div>
  <div class="shop-item" id="upg-octopus">
    <div><div class="name">🐙 문어 물고기 드랍</div><div class="desc" id="upg-octopus-desc">문어가 가끔 물고기 드랍</div></div>
    <div class="cost" id="upg-octopus-cost">5,000🐟</div>
  </div>
  <button id="shop-close">닫기</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── State ────────────────────────────────────────────────
let W, H, cx;
let gameState = 'start'; // start | playing | dead
let dist = 0, bestDist = 0;
let fish = 0;
let hearts = 3;
let score = 0;
let tilt = 0;       // -1..1 from gyro
let penX = 0;       // penguin x offset (-1..1 of half road width)
let penY = 0;       // jump height (0 = ground)
let penVY = 0;      // jump velocity
let jumping = false, canDoubleJump = false, doubleJumped = false;
let invincible = 0; // frames
let rocketActive = false, rocketTimer = 0;
let vacuumActive = false, vacuumTimer = 0;
let dashActive = false, dashTimer = 0;
let inkTimer = 0;   // octopus ink screen cover
let selectedSkin = 0;
let frame = 0;

// upgrades (persistent)
let upgrades = { rocket: 0, hp: 0, octopus: 0 };
try { let s = JSON.parse(localStorage.getItem('hdp_upg')||'{}'); Object.assign(upgrades, s); } catch(e){}
let totalFish = 0;
try { totalFish = parseInt(localStorage.getItem('hdp_fish')||'0'); } catch(e){}
try { bestDist = parseFloat(localStorage.getItem('hdp_best')||'0'); } catch(e){}
try { selectedSkin = parseInt(localStorage.getItem('hdp_skin')||'0'); } catch(e){}

// Speed
let speed = 0;
const BASE_SPEED = 0.018; // world units/frame
const MAX_SPEED = 0.065;

// Objects in world (z: 0=horizon, 1=camera)
let obstacles = [];
let items = [];
let particles = [];

// Milestone rewards
const FISH_BOX_MILESTONES = [100,300,600,1000,1500,2200,3000,4200,6000,8000,12000,16000];
let nextMilestoneIdx = 0;
let hpBonusNext = 500; // next hp bonus at dist

// Popup
let popupTimer = 0, popupText = '';

// ── Resize ───────────────────────────────────────────────
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
}
window.addEventListener('resize', resize);
resize();

// ── Perspective helpers ──────────────────────────────────
const HORIZON_Y = 0.38; // fraction of H
const ROAD_W_BOTTOM = 0.92; // fraction of W
const ROAD_W_HORIZON = 0.08; // fraction of W
const CAM_HEIGHT = 0.35; // perspective param

function projZ(z) {
  // z: 0..1, 0=near penguin, 1=horizon
  const t = 1 - z; // t=1 near, t=0 far
  const y = H * (HORIZON_Y + (1 - HORIZON_Y) * t);
  const rw = W * (ROAD_W_HORIZON + (ROAD_W_BOTTOM - ROAD_W_HORIZON) * t);
  return { y, rw };
}

function worldToScreen(wx, wz) {
  const { y, rw } = projZ(wz);
  const x = cx + wx * rw / 2;
  return { x, y };
}

// ── Drawing ──────────────────────────────────────────────
const SKY_TOP = '#0D1F3C';
const SKY_BOTTOM = '#1A6B8A';
const SEA_LEFT = '#0E4C7A';
const SEA_RIGHT = '#0A3D62';
const ICE_COLOR = '#D4EDFF';
const ICE_LINE = '#A8D8F0';
const ICE_SHADOW = '#8EC8E8';

function drawBg() {
  // Sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H * HORIZON_Y);
  g.addColorStop(0, SKY_TOP);
  g.addColorStop(1, SKY_BOTTOM);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H * HORIZON_Y);

  // Sea sides
  const hy = H * HORIZON_Y;
  const rhX = cx + W * ROAD_W_HORIZON / 2;
  const lhX = cx - W * ROAD_W_HORIZON / 2;
  const rbX = cx + W * ROAD_W_BOTTOM / 2;
  const lbX = cx - W * ROAD_W_BOTTOM / 2;

  // Left sea
  ctx.fillStyle = SEA_LEFT;
  ctx.beginPath();
  ctx.moveTo(0, hy); ctx.lineTo(lhX, hy);
  ctx.lineTo(lbX, H); ctx.lineTo(0, H);
  ctx.fill();

  // Right sea
  ctx.fillStyle = SEA_RIGHT;
  ctx.beginPath();
  ctx.moveTo(W, hy); ctx.lineTo(rhX, hy);
  ctx.lineTo(rbX, H); ctx.lineTo(W, H);
  ctx.fill();

  // Ice road
  const ig = ctx.createLinearGradient(0, hy, 0, H);
  ig.addColorStop(0, '#B8DDEF');
  ig.addColorStop(1, ICE_COLOR);
  ctx.fillStyle = ig;
  ctx.beginPath();
  ctx.moveTo(lhX, hy); ctx.lineTo(rhX, hy);
  ctx.lineTo(rbX, H); ctx.lineTo(lbX, H);
  ctx.fill();

  // Road lines (perspective)
  ctx.strokeStyle = ICE_LINE;
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 4; i++) {
    const t = i / 4;
    const { y: ly, rw } = projZ(1 - t);
    ctx.beginPath();
    ctx.moveTo(cx - rw / 2, ly); ctx.lineTo(cx + rw / 2, ly);
    ctx.stroke();
  }

  // Road edge lines
  ctx.strokeStyle = '#7EC8E3';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(lhX, hy); ctx.lineTo(lbX, H);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rhX, hy); ctx.lineTo(rbX, H);
  ctx.stroke();

  // Horizon glow
  const hg = ctx.createLinearGradient(0, hy - 20, 0, hy + 20);
  hg.addColorStop(0, 'rgba(173,216,230,0)');
  hg.addColorStop(0.5, 'rgba(173,216,230,0.18)');
  hg.addColorStop(1, 'rgba(173,216,230,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, hy - 20, W, 40);

  // Stars (far)
  if (dist > 5000) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 30; i++) {
      const sx = (i * 137.5 + dist * 0.002) % W;
      const sy = (i * 73.1) % (H * HORIZON_Y * 0.8);
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
  }
}

const SKIN_COLORS = [
  { body: '#4A9CE8', belly: '#B3D9FF', eye: '#1A3A5C' },
  { body: '#E8A44A', belly: '#FFF0CC', eye: '#3A1A00' },
  { body: '#E84A4A', belly: '#FFD4D4', eye: '#3A001A' },
];

function drawPenguin() {
  const skin = SKIN_COLORS[selectedSkin];
  const py = H - 80;
  const px = cx + penX * W * ROAD_W_BOTTOM / 2 * 0.7;
  const jumpOff = -penY * 60;
  const t = py + jumpOff;
  const s = rocketActive ? 1.35 : 1.0;

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.25 - penY * 0.1;
  ctx.fillStyle = '#000';
  ctx.ellipse(px, py + 4, 22 * s, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  if (invincible > 0 && frame % 4 < 2) { ctx.globalAlpha = 0.4; }

  // Body
  ctx.save();
  ctx.translate(px, t);
  if (rocketActive) {
    // Rocket flames
    for (let i = 0; i < 3; i++) {
      const fx = (i - 1) * 10;
      const fy = 40;
      const fg = ctx.createLinearGradient(fx, fy, fx, fy + 20 + Math.sin(frame * 0.3 + i) * 6);
      fg.addColorStop(0, '#FF6B00');
      fg.addColorStop(1, 'rgba(255,200,0,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(fx - 5, fy);
      ctx.lineTo(fx + 5, fy);
      ctx.lineTo(fx, fy + 20 + Math.sin(frame * 0.3 + i) * 6);
      ctx.fill();
    }
    // Rocket casing
    ctx.fillStyle = '#3A90D8';
    ctx.beginPath();
    ctx.roundRect(-12, 22, 24, 28, 6);
    ctx.fill();
    ctx.fillStyle = '#7DC8F7';
    ctx.beginPath();
    ctx.roundRect(-8, 24, 16, 10, 4);
    ctx.fill();
  }
  // Feet
  ctx.fillStyle = '#FF8C00';
  ctx.beginPath(); ctx.ellipse(-8, 34, 8, 5, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8, 34, 8, 5, 0.3, 0, Math.PI * 2); ctx.fill();
  // Body
  ctx.fillStyle = skin.body;
  ctx.beginPath(); ctx.ellipse(0, 10, 18, 24, 0, 0, Math.PI * 2); ctx.fill();
  // Belly
  ctx.fillStyle = skin.belly;
  ctx.beginPath(); ctx.ellipse(0, 14, 11, 17, 0, 0, Math.PI * 2); ctx.fill();
  // Head
  ctx.fillStyle = skin.body;
  ctx.beginPath(); ctx.arc(0, -14, 16, 0, Math.PI * 2); ctx.fill();
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-6, -17, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -17, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = skin.eye;
  ctx.beginPath(); ctx.arc(-5, -17, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -17, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-4, -18, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -18, 1.5, 0, Math.PI * 2); ctx.fill();
  // Beak
  ctx.fillStyle = '#FFB300';
  ctx.beginPath(); ctx.moveTo(-4, -13); ctx.lineTo(4, -13); ctx.lineTo(0, -9); ctx.fill();
  // Helmet (skin 2)
  if (selectedSkin === 2) {
    ctx.fillStyle = '#CC1111';
    ctx.beginPath(); ctx.arc(0, -18, 16, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#FF2222';
    ctx.fillRect(-16, -19, 32, 6);
  }
  // Stripes (skin 1)
  if (selectedSkin === 1) {
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 4;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(i * 8, -2); ctx.lineTo(i * 8, 28); ctx.stroke();
    }
  }
  ctx.restore();

  // Vacuum aura
  if (vacuumActive) {
    const r = 80 + Math.sin(frame * 0.1) * 10;
    const grad = ctx.createRadialGradient(px, t, r * 0.4, px, t, r);
    grad.addColorStop(0, 'rgba(255,200,255,0.12)');
    grad.addColorStop(0.5, 'rgba(100,200,255,0.18)');
    grad.addColorStop(1, 'rgba(100,255,200,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(px, t, r, 0, Math.PI * 2); ctx.fill();
    // Rainbow ring
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2 + frame * 0.04;
      const rx = px + Math.cos(angle) * r;
      const ry = t + Math.sin(angle) * r * 0.5;
      ctx.fillStyle = `hsl(${(i * 30 + frame * 3) % 360},100%,65%)`;
      ctx.beginPath(); ctx.arc(rx, ry, 5, 0, Math.PI * 2); ctx.fill();
    }
  }

  ctx.globalAlpha = 1;
}

function drawObstacles() {
  for (const o of obstacles) {
    if (o.z < 0 || o.z > 1) continue;
    const { x, y } = worldToScreen(o.wx, o.z);
    const sz = (1 - o.z) * 0.9 + 0.1;
    const s = sz * 60;

    if (o.type === 'icicle') {
      // Shadow on ice
      ctx.fillStyle = 'rgba(0,80,120,0.22)';
      ctx.ellipse(x, y + 4, s * 0.4, s * 0.1, 0, 0, Math.PI * 2);
      ctx.fill();
      // Icicle spike
      ctx.fillStyle = '#B8EEF8';
      ctx.beginPath();
      ctx.moveTo(x - s * 0.3, y - s * 0.1);
      ctx.lineTo(x + s * 0.3, y - s * 0.1);
      ctx.lineTo(x, y + s * 0.7);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.moveTo(x - s * 0.1, y - s * 0.1);
      ctx.lineTo(x, y - s * 0.05);
      ctx.lineTo(x - s * 0.05, y + s * 0.3);
      ctx.fill();
    } else if (o.type === 'octopus') {
      // Body
      ctx.fillStyle = '#E8A0C0';
      ctx.beginPath(); ctx.arc(x, y - s * 0.1, s * 0.35, 0, Math.PI * 2); ctx.fill();
      // Tentacles
      for (let t = 0; t < 6; t++) {
        const tx = x + Math.cos((t / 6) * Math.PI * 2) * s * 0.4;
        const ty = y + s * 0.2 + Math.sin((t / 6) * Math.PI * 2 + frame * 0.08) * s * 0.15;
        ctx.strokeStyle = '#E070A0';
        ctx.lineWidth = s * 0.1;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(tx, ty, tx, ty + s * 0.2); ctx.stroke();
      }
      // Eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x - s * 0.12, y - s * 0.15, s * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + s * 0.12, y - s * 0.15, s * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1A1A1A';
      ctx.beginPath(); ctx.arc(x - s * 0.1, y - s * 0.15, s * 0.055, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + s * 0.14, y - s * 0.15, s * 0.055, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'log_door') {
      // Log door pair - gate
      const gapW = s * 0.45;
      const gapX = x + o.gapOffset * s;
      // Left log
      ctx.fillStyle = '#8B4513';
      ctx.beginPath(); ctx.roundRect(x - s * 1.4, y - s * 0.5, s * 1.4 - gapW / 2 + gapX - x, s, 8); ctx.fill();
      ctx.strokeStyle = '#5D2E0C'; ctx.lineWidth = 2;
      ctx.strokeRect(x - s * 1.4, y - s * 0.5, s * 1.4 - gapW / 2 + gapX - x, s);
      // Right log
      const rightStart = gapX + gapW / 2;
      ctx.fillStyle = '#8B4513';
      ctx.beginPath(); ctx.roundRect(rightStart, y - s * 0.5, x + s * 1.4 - rightStart, s, 8); ctx.fill();
      ctx.strokeStyle = '#5D2E0C';
      ctx.strokeRect(rightStart, y - s * 0.5, x + s * 1.4 - rightStart, s);
      // Wood grain
      ctx.strokeStyle = 'rgba(255,200,120,0.3)'; ctx.lineWidth = 1.5;
      for (let g = 0; g < 3; g++) {
        ctx.beginPath();
        ctx.moveTo(x - s * 1.4, y - s * 0.2 + g * s * 0.25);
        ctx.lineTo(x - s * 0.05 + gapX - x, y - s * 0.2 + g * s * 0.25);
        ctx.stroke();
      }
    } else if (o.type === 'ice_wall') {
      // Ice wall narrowing
      const lw = s * (1 + o.wallPhase * 0.5);
      // Left wall
      ctx.fillStyle = 'rgba(180,220,240,0.75)';
      ctx.beginPath(); ctx.roundRect(x - s * 2, y - s * 0.6, lw, s * 1.2, 10); ctx.fill();
      ctx.strokeStyle = '#90E0EF'; ctx.lineWidth = 2;
      ctx.strokeRect(x - s * 2, y - s * 0.6, lw, s * 1.2);
      // Right wall
      ctx.fillStyle = 'rgba(180,220,240,0.75)';
      ctx.beginPath(); ctx.roundRect(x + s * 2 - lw, y - s * 0.6, lw, s * 1.2, 10); ctx.fill();
      ctx.strokeStyle = '#90E0EF'; ctx.lineWidth = 2;
      ctx.strokeRect(x + s * 2 - lw, y - s * 0.6, lw, s * 1.2);
    } else if (o.type === 'gap') {
      // Ice gap - dark crack across the road
      const gw = projZ(o.z).rw;
      const gx = cx - gw / 2;
      ctx.fillStyle = 'rgba(0,30,60,0.65)';
      ctx.fillRect(gx, y - s * 0.1, gw, s * 0.25);
      // Crack lines
      ctx.strokeStyle = '#004080';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const cx2 = gx + (i + 0.5) * (gw / 5);
        ctx.moveTo(cx2 - 10, y - s * 0.1);
        ctx.lineTo(cx2 + 5, y + s * 0.15);
      }
      ctx.stroke();
    }
  }
}

function drawItems() {
  for (const it of items) {
    if (it.z < 0 || it.z > 1) continue;
    const { x, y } = worldToScreen(it.wx, it.z);
    const sz = (1 - it.z) * 0.75 + 0.15;
    const s = sz * 28;
    const bob = Math.sin(frame * 0.12 + it.phase) * s * 0.18;

    if (it.type === 'fish_orange') {
      drawFish(x, y + bob, s, '#FF8C00', '#FFB347');
    } else if (it.type === 'fish_green') {
      drawFish(x, y + bob, s, '#2ECC71', '#82E0AA');
    } else if (it.type === 'diamond') {
      ctx.save();
      ctx.translate(x, y + bob);
      ctx.rotate(Math.sin(frame * 0.05) * 0.15);
      ctx.fillStyle = '#7EC8F7';
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s * 0.7, 0); ctx.lineTo(0, s * 1.2);
      ctx.lineTo(-s * 0.7, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s * 0.4, -s * 0.3); ctx.lineTo(0, 0); ctx.fill();
      ctx.restore();
    } else if (it.type === 'rocket_item') {
      ctx.save();
      ctx.translate(x, y + bob);
      ctx.fillStyle = '#3A90D8';
      ctx.beginPath(); ctx.roundRect(-s * 0.4, -s * 0.6, s * 0.8, s * 1.5, 8); ctx.fill();
      ctx.fillStyle = '#FF4500';
      ctx.beginPath(); ctx.moveTo(-s * 0.4, s * 0.9); ctx.lineTo(0, s * 0.5); ctx.lineTo(s * 0.4, s * 0.9); ctx.fill();
      ctx.fillStyle = '#7DC8F7';
      ctx.beginPath(); ctx.arc(0, -s * 0.2, s * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (it.type === 'vacuum') {
      ctx.save();
      ctx.translate(x, y + bob);
      const vg = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 1.2);
      vg.addColorStop(0, 'rgba(255,100,255,0.8)');
      vg.addColorStop(0.5, 'rgba(100,200,255,0.5)');
      vg.addColorStop(1, 'rgba(100,255,200,0)');
      ctx.fillStyle = vg;
      ctx.beginPath(); ctx.arc(0, 0, s * 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = `${s * 1.2}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🌈', 0, 0);
      ctx.restore();
    } else if (it.type === 'dash') {
      ctx.save();
      ctx.translate(x, y + bob);
      ctx.fillStyle = '#FFD700';
      ctx.font = `${s * 1.3}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('⚡', 0, 0);
      ctx.restore();
    } else if (it.type === 'extra_life') {
      ctx.save();
      ctx.translate(x, y + bob);
      ctx.fillStyle = '#FF4466';
      ctx.font = `${s * 1.3}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('❤️', 0, 0);
      ctx.restore();
    }
  }
}

function drawFish(x, y, s, col1, col2) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = col1;
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.9, s * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = col2;
  ctx.beginPath();
  ctx.moveTo(s * 0.6, 0); ctx.lineTo(s * 1.2, -s * 0.35);
  ctx.lineTo(s * 1.2, s * 0.35); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-s * 0.3, -s * 0.1, s * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.life -= 0.035;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // Distance
  document.getElementById('dist-val').textContent = Math.floor(dist) + 'm';
  document.getElementById('best-val').textContent = 'Best ' + Math.floor(bestDist) + 'm';
  document.getElementById('fish-val').textContent = fish.toLocaleString();

  // Hearts
  const hEl = document.getElementById('hearts');
  hEl.textContent = '';
  for (let i = 0; i < 3; i++) {
    const span = document.createElement('span');
    span.textContent = i < hearts ? '❤️' : '🖤';
    hEl.appendChild(span);
  }

  // Powerup indicators
  if (rocketActive) showPowerupBar('🚀', rocketTimer / rocketMaxDist(), '#3A90D8');
  if (vacuumActive) showPowerupBar('🌈', vacuumTimer / 300, '#FF80FF');
  if (dashActive) showPowerupBar('⚡', dashTimer / 60, '#FFD700');
}

function showPowerupBar(icon, frac, col) {
  // Quick inline display near penguin
  const px = cx;
  const py = H - 150;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(px - 40, py, 80, 12, 6); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.roundRect(px - 40, py, 80 * Math.max(0, frac), 12, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(icon, px - 50, py + 6);
}

function drawInk() {
  if (inkTimer <= 0) return;
  const alpha = Math.min(1, inkTimer / 60) * 0.8;
  ctx.fillStyle = `rgba(20,0,40,${alpha})`;
  ctx.fillRect(0, 0, W, H);
  // Ink splatters
  ctx.fillStyle = `rgba(40,0,60,${alpha * 0.6})`;
  for (let i = 0; i < 8; i++) {
    const bx = W * (0.1 + (i * 0.137) % 0.8);
    const by = H * (0.1 + (i * 0.237) % 0.8);
    ctx.beginPath(); ctx.arc(bx, by, 30 + (i * 19) % 40, 0, Math.PI * 2); ctx.fill();
  }
}

function rocketMaxDist() {
  return 600 + upgrades.rocket * 200;
}

// ── Spawn ────────────────────────────────────────────────
let spawnTimer = 0;
let itemSpawnTimer = 0;

function spawnObstacle() {
  const r = Math.random();
  const wx = (Math.random() - 0.5) * 1.6;
  if (dist < 200) {
    // Only icicles early
    obstacles.push({ type: 'icicle', wx, z: 0.98, active: true });
    return;
  }
  if (r < 0.30) {
    obstacles.push({ type: 'icicle', wx: (Math.random() - 0.5) * 1.4, z: 0.98, active: true });
    // Second icicle sometimes
    if (dist > 500 && Math.random() < 0.4) {
      obstacles.push({ type: 'icicle', wx: wx + (Math.random() > 0.5 ? 0.8 : -0.8), z: 0.98, active: true });
    }
  } else if (r < 0.52) {
    obstacles.push({ type: 'log_door', wx: 0, gapOffset: (Math.random() - 0.5) * 0.9, z: 0.98, active: true });
  } else if (r < 0.66) {
    obstacles.push({ type: 'octopus', wx: (Math.random() - 0.5) * 1.2, z: 0.98, active: true });
  } else if (r < 0.78 && dist > 800) {
    obstacles.push({ type: 'gap', wx: 0, z: 0.98, active: true });
  } else if (dist > 1500) {
    obstacles.push({ type: 'ice_wall', wx: 0, wallPhase: Math.random(), z: 0.98, active: true });
  } else {
    obstacles.push({ type: 'icicle', wx, z: 0.98, active: true });
  }
}

function spawnItem() {
  const r = Math.random();
  const wx = (Math.random() - 0.5) * 1.4;
  const phase = Math.random() * Math.PI * 2;
  if (r < 0.45) {
    items.push({ type: 'fish_orange', wx, z: 0.98, phase, active: true });
    // Spawn a line of fish (safe path hint)
    if (Math.random() < 0.5) {
      for (let i = 1; i < 4; i++) {
        items.push({ type: 'fish_orange', wx, z: Math.min(0.98, 0.98 - i * 0.04), phase, active: true });
      }
    }
  } else if (r < 0.62) {
    items.push({ type: 'fish_green', wx, z: 0.98, phase, active: true });
  } else if (r < 0.72) {
    items.push({ type: 'diamond', wx, z: 0.98, phase, active: true });
  } else if (r < 0.80 && dist > 600) {
    items.push({ type: 'rocket_item', wx, z: 0.98, phase, active: true });
  } else if (r < 0.87 && dist > 400) {
    items.push({ type: 'vacuum', wx, z: 0.98, phase, active: true });
  } else if (r < 0.93 && dist > 300) {
    items.push({ type: 'dash', wx, z: 0.98, phase, active: true });
  } else {
    items.push({ type: 'extra_life', wx, z: 0.98, phase, active: true });
  }
}

// ── Collision ────────────────────────────────────────────
function checkCollisions() {
  if (invincible > 0 || dashActive) return;

  const penScreenX = cx + penX * W * ROAD_W_BOTTOM / 2 * 0.7;
  const penScreenY = H - 80 - penY * 60;

  for (const o of obstacles) {
    if (!o.active || o.z > 0.25 || o.z < 0) continue;
    const { x, y } = worldToScreen(o.wx, o.z);
    const sz = (1 - o.z) * 60;
    let hit = false;

    if (o.type === 'icicle') {
      hit = Math.abs(penScreenX - x) < sz * 0.5 && Math.abs(penScreenY - y) < sz * 0.7 && penY < 0.4;
    } else if (o.type === 'octopus') {
      hit = Math.abs(penScreenX - x) < sz * 0.7 && Math.abs(penScreenY - y) < sz * 0.8;
      if (hit && upgrades.octopus > 0 && Math.random() < 0.3) {
        spawnFishAt(x, y);
      }
      if (hit) inkTimer = 180;
    } else if (o.type === 'log_door') {
      const gapX = x + o.gapOffset * sz;
      const gapW = sz * 0.45;
      const inGap = penScreenX > gapX - gapW / 2 && penScreenX < gapX + gapW / 2;
      hit = !inGap && Math.abs(penScreenY - y) < sz * 0.7;
    } else if (o.type === 'gap') {
      hit = penY < 0.05 && Math.abs(penScreenY - y) < sz * 0.2;
    } else if (o.type === 'ice_wall') {
      const lw = sz * (1 + o.wallPhase * 0.5);
      const leftEdge = x - sz * 2 + lw;
      const rightEdge = x + sz * 2 - lw;
      hit = (penScreenX < leftEdge || penScreenX > rightEdge) && Math.abs(penScreenY - y) < sz * 0.8;
    }

    if (hit) {
      o.active = false;
      takeDamage(o.wx, o.z);
      return;
    }
  }

  // Item collection
  for (const it of items) {
    if (!it.active) continue;
    const { x, y } = worldToScreen(it.wx, it.z);
    const sz = (1 - it.z) * 28;

    let dist2 = Math.hypot(penScreenX - x, penScreenY - y);
    const pickupR = vacuumActive ? 80 : sz * 1.4;

    if (dist2 < pickupR) {
      it.active = false;
      collectItem(it.type, x, y);
    }
  }
}

function spawnFishAt(x, y) {
  for (let i = 0; i < 3; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: -Math.random() * 3,
      r: 6, col: '#FF8C00', life: 1
    });
  }
  fish += 1;
}

function takeDamage(wx, wz) {
  if (invincible > 0) return;
  hearts--;
  invincible = 120;
  showPopup(hearts <= 0 ? '💔' : (Math.random() < 0.4 ? '구사일생!' : '앗!'));
  spawnDamageParticles();
  if (hearts <= 0) {
    setTimeout(() => endGame(), 600);
  }
}

function spawnDamageParticles() {
  const px = cx + penX * W * ROAD_W_BOTTOM / 2 * 0.7;
  const py = H - 80 - penY * 60;
  for (let i = 0; i < 16; i++) {
    particles.push({
      x: px, y: py,
      vx: (Math.random() - 0.5) * 8,
      vy: -Math.random() * 6,
      r: 5 + Math.random() * 5,
      col: ['#FF4444','#FF8C00','#FFD700'][Math.floor(Math.random()*3)],
      life: 1
    });
  }
}

function collectItem(type, x, y) {
  let gain = 0;
  if (type === 'fish_orange') { gain = 1; spawnCollectParticles(x, y, '#FF8C00'); }
  else if (type === 'fish_green') { gain = 5; spawnCollectParticles(x, y, '#2ECC71'); }
  else if (type === 'diamond') { gain = 20; showPopup('💎 +20'); spawnCollectParticles(x, y, '#7EC8F7'); }
  else if (type === 'rocket_item') { rocketActive = true; rocketTimer = 0; showPopup('🚀 로켓!'); }
  else if (type === 'vacuum') { vacuumActive = true; vacuumTimer = 300; showPopup('🌈 진공 오라!'); }
  else if (type === 'dash') { dashActive = true; dashTimer = 60; showPopup('⚡ 무적 대쉬!'); }
  else if (type === 'extra_life') { if (hearts < 5) { hearts++; showPopup('❤️ +1 생명!'); } }
  if (gain > 0) fish += gain;
}

function spawnCollectParticles(x, y, col) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: -1 - Math.random() * 3,
      r: 4, col, life: 1
    });
  }
}

// ── Popup ────────────────────────────────────────────────
function showPopup(text) {
  popupText = text;
  popupTimer = 90;
  const el = document.getElementById('popup');
  el.textContent = text;
  el.style.opacity = '1';
}

function updatePopup() {
  if (popupTimer > 0) {
    popupTimer--;
    if (popupTimer < 20) {
      document.getElementById('popup').style.opacity = (popupTimer / 20).toFixed(2);
    }
  }
}

// ── Controls ─────────────────────────────────────────────
let gyroAvailable = false;
window.addEventListener('deviceorientation', (e) => {
  if (e.gamma === null) return;
  gyroAvailable = true;
  tilt = Math.max(-1, Math.min(1, e.gamma / 35));
}, true);

// Touch jump
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameState === 'playing') doJump();
}, { passive: false });

// Keyboard fallback
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') tilt = -0.6;
  if (e.key === 'ArrowRight') tilt = 0.6;
  if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); doJump(); }
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') tilt = 0;
});

// Mouse fallback for desktop
let mouseDown = false;
canvas.addEventListener('mousedown', (e) => { mouseDown = true; doJump(); });
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mousemove', (e) => {
  const rel = (e.clientX - W / 2) / (W / 2);
  tilt = rel * 0.8;
});

function doJump() {
  if (!jumping) {
    penVY = -0.045;
    jumping = true;
    canDoubleJump = true;
    doubleJumped = false;
  } else if (canDoubleJump && !doubleJumped) {
    penVY = -0.038;
    doubleJumped = true;
    canDoubleJump = false;
    showPopup('더블 점프!');
  }
}

// ── Game loop ────────────────────────────────────────────
function startGame() {
  gameState = 'playing';
  dist = 0; fish = 0; hearts = 3; frame = 0;
  obstacles = []; items = []; particles = [];
  penX = 0; penY = 0; penVY = 0; jumping = false;
  speed = BASE_SPEED;
  rocketActive = false; vacuumActive = false; dashActive = false;
  inkTimer = 0; invincible = 0;
  spawnTimer = 0; itemSpawnTimer = 0;
  nextMilestoneIdx = 0;
  hpBonusNext = 500;
  // Pre-place some items on first stretch
  for (let i = 0; i < 8; i++) {
    items.push({ type: 'fish_orange', wx: (Math.random()-0.5)*1.2, z: 0.6 + i*0.04, phase: Math.random()*Math.PI*2, active:true });
  }
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('gameover-screen').style.display = 'none';
}

function endGame() {
  gameState = 'dead';
  if (dist > bestDist) {
    bestDist = dist;
    try { localStorage.setItem('hdp_best', bestDist); } catch(e){}
    showPopup('🏆 신기록!');
  }
  totalFish += fish;
  try { localStorage.setItem('hdp_fish', totalFish); } catch(e){}

  document.getElementById('go-score').textContent = Math.floor(dist) + 'm';
  document.getElementById('go-best').textContent = '최고 기록: ' + Math.floor(bestDist) + 'm';
  document.getElementById('gameover-screen').style.display = 'flex';
}

function update() {
  if (gameState !== 'playing') return;
  frame++;

  // Speed ramp
  speed = Math.min(MAX_SPEED, BASE_SPEED + dist * 0.000018 + (rocketActive ? 0.03 : 0));

  // Distance
  dist += speed * 60;

  // Penguin X movement
  const moveSpeed = rocketActive ? 0.025 : 0.018;
  if (gyroAvailable || mouseDown) {
    penX = Math.max(-1, Math.min(1, penX + tilt * moveSpeed));
  } else {
    penX = Math.max(-1, Math.min(1, penX + tilt * moveSpeed));
  }

  // Jump physics
  if (penY > 0 || penVY < 0) {
    penY += penVY;
    penVY += 0.0028;
    if (penY <= 0) { penY = 0; penVY = 0; jumping = false; canDoubleJump = false; doubleJumped = false; }
  }

  // Rocket
  if (rocketActive) {
    rocketTimer += speed * 60;
    if (rocketTimer >= rocketMaxDist()) { rocketActive = false; rocketTimer = 0; }
  }

  // Vacuum
  if (vacuumActive) { vacuumTimer--; if (vacuumTimer <= 0) vacuumActive = false; }

  // Dash
  if (dashActive) { dashTimer--; if (dashTimer <= 0) { dashActive = false; invincible = 30; } }

  // Invincible
  if (invincible > 0) invincible--;

  // Ink
  if (inkTimer > 0) inkTimer--;

  // HP bonus
  if (upgrades.hp > 0 && dist >= hpBonusNext) {
    if (hearts < 5) { hearts++; showPopup('생명력 보너스 사용 완료!'); }
    hpBonusNext += 500;
  }

  // Milestones
  if (nextMilestoneIdx < FISH_BOX_MILESTONES.length && dist >= FISH_BOX_MILESTONES[nextMilestoneIdx]) {
    const reward = 50 + nextMilestoneIdx * 30;
    fish += reward;
    showPopup('🐟 물고기 상자! +' + reward);
    nextMilestoneIdx++;
  }

  // Move objects toward camera
  const dz = speed;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].z -= dz;
    if (obstacles[i].z < -0.05) obstacles.splice(i, 1);
  }
  for (let i = items.length - 1; i >= 0; i--) {
    items[i].z -= dz;
    if (items[i].z < -0.05) items.splice(i, 1);
  }

  // Spawn
  spawnTimer--;
  const spawnInterval = Math.max(20, 60 - dist * 0.003);
  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = spawnInterval + (Math.random() - 0.5) * 15;
  }
  itemSpawnTimer--;
  const itemInterval = Math.max(10, 30 - dist * 0.002);
  if (itemSpawnTimer <= 0) {
    spawnItem();
    itemSpawnTimer = itemInterval + (Math.random() - 0.5) * 10;
  }

  checkCollisions();
  updatePopup();

  // Praise text for running far
  if (dist > 0 && Math.floor(dist) % 500 === 0 && Math.floor(dist) !== score) {
    score = Math.floor(dist);
    const praises = ['훌륭합니다!', '멋져요!', '대단해요!', '계속 달려!', '놀라워요!'];
    if (dist < bestDist * 0.9 + 200) {}
    else showPopup(praises[Math.floor(Math.random() * praises.length)]);
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawBg();
  drawObstacles();
  drawItems();
  drawParticles();
  if (gameState === 'playing' || gameState === 'dead') drawPenguin();
  drawInk();
  if (gameState === 'playing') drawHUD();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

  document.getElementById('upg-rocket-cost').textContent = '40,000🐟';
  document.getElementById('upg-hp-cost').textContent = '10,000🐟';
  document.getElementById('upg-octopus-cost').textContent = upgrades.octopus ? '완료 ✓' : '5,000🐟';
}

document.getElementById('upg-rocket').addEventListener('click', () => {
  const cost = 40000;
  if (totalFish >= cost) { totalFish -= cost; upgrades.rocket++; saveUpgrades(); showPopup('🚀 업그레이드!'); updateShopUI(); }
  else showPopup('물고기가 부족해요!');
});
document.getElementById('upg-hp').addEventListener('click', () => {
  const cost = 10000;
  if (totalFish >= cost) { totalFish -= cost; upgrades.hp++; saveUpgrades(); showPopup('❤️ 업그레이드!'); updateShopUI(); }
  else showPopup('물고기가 부족해요!');
});
document.getElementById('upg-octopus').addEventListener('click', () => {
  if (upgrades.octopus) return;
  const cost = 5000;
  if (totalFish >= cost) { totalFish -= cost; upgrades.octopus = 1; saveUpgrades(); showPopup('🐙 업그레이드!'); updateShopUI(); }
  else showPopup('물고기가 부족해요!');
});

function saveUpgrades() {
  try {
    localStorage.setItem('hdp_upg', JSON.stringify(upgrades));
    localStorage.setItem('hdp_fish', totalFish);
  } catch(e) {}
}

document.getElementById('shop-close').addEventListener('click', closeShop);
document.getElementById('gear-btn').addEventListener('click', openShop);
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);
document.getElementById('shop-btn-go').addEventListener('click', () => {
  document.getElementById('gameover-screen').style.display = 'none';
  openShop();
});

// Skin selector
document.querySelectorAll('.skin-btn').forEach(btn => {
  if (parseInt(btn.dataset.skin) === selectedSkin) btn.classList.add('selected');
  else btn.classList.remove('selected');
  btn.addEventListener('click', () => {
    selectedSkin = parseInt(btn.dataset.skin);
    try { localStorage.setItem('hdp_skin', selectedSkin); } catch(e){}
    document.querySelectorAll('.skin-btn').forEach(b => b.classList.toggle('selected', parseInt(b.dataset.skin) === selectedSkin));
  });
});

loop();
</script>
</body>
</html>
